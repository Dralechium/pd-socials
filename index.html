<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(255, 75, 20, 0.13),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(180, 45, 10, 0.07),
                    transparent 30%
                ),
                #070504;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            background: #ff4d18;

            opacity: 0.045;

            filter: blur(140px);

            border-radius: 50%;

            top: -250px;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            background: #ff5a1f;

            opacity: 0.02;

            filter: blur(130px);

            border-radius: 50%;

            bottom: -200px;
            right: -100px;

            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;

            padding: 30px 20px;

            text-align: center;

            position: relative;
            z-index: 1;
        }


        /* =========================
           PROFILE PICTURE
        ========================= */

        .profile-picture {
            width: 115px;
            height: 115px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: linear-gradient(
                145deg,
                #1b100c,
                #080605
            );

            border: 2px solid rgba(255, 91, 35, 0.8);

            box-shadow:
                0 0 15px rgba(255, 75, 20, 0.45),
                0 0 45px rgba(255, 75, 20, 0.16),
                0 0 80px rgba(255, 60, 15, 0.06);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            position: relative;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           USERNAME
        ========================= */

        .username {
            font-size: 30px;

            font-weight: 800;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 80, 25, 0.25),
                0 0 25px rgba(255, 60, 15, 0.08);

            margin-bottom: 7px;
        }


        /* =========================
           HANDLE
        ========================= */

        .handle {
            color: #ff6127;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 14px;

            text-shadow:
                0 0 10px rgba(255, 75, 20, 0.25);
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            color: #a59a95;

            font-size: 14px;

            line-height: 1.6;

            max-width: 400px;

            margin: 0 auto 28px;
        }


        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .socials {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        /* =========================
           SOCIAL COLOR VARIABLES
        ========================= */

        .youtube {
            --social-color: #ff0000;
            --social-color-soft: rgba(255, 0, 0, 0.12);
            --social-border: rgba(255, 0, 0, 0.22);
            --social-glow: rgba(255, 0, 0, 0.18);
        }

        .twitch {
            --social-color: #9146ff;
            --social-color-soft: rgba(145, 70, 255, 0.12);
            --social-border: rgba(145, 70, 255, 0.22);
            --social-glow: rgba(145, 70, 255, 0.18);
        }

        .twitter {
            --social-color: #1d9bf0;
            --social-color-soft: rgba(29, 155, 240, 0.12);
            --social-border: rgba(29, 155, 240, 0.22);
            --social-glow: rgba(29, 155, 240, 0.18);
        }

        .discord {
            --social-color: #5865f2;
            --social-color-soft: rgba(88, 101, 242, 0.12);
            --social-border: rgba(88, 101, 242, 0.22);
            --social-glow: rgba(88, 101, 242, 0.18);
        }

        .instagram {
            --social-color: #f13f79;
            --social-color-soft: rgba(225, 48, 108, 0.12);
            --social-border: rgba(225, 48, 108, 0.22);
            --social-glow: rgba(225, 48, 108, 0.18);
        }

        .tiktok {
            --social-color: #00f2ea;
            --social-color-soft: rgba(0, 242, 234, 0.12);
            --social-border: rgba(0, 242, 234, 0.22);
            --social-glow: rgba(0, 242, 234, 0.18);
        }


        /* =========================
           SOCIAL BUTTON
        ========================= */

        .social-button {
            position: relative;

            width: 100%;
            min-height: 62px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 13, 10, 0.97),
                    rgba(9, 7, 6, 0.98)
                );

            border: 1px solid var(--social-border);

            color: white;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            overflow: hidden;
        }


        /* =========================
           COLORED LEFT LINE
        ========================= */

        .social-button::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background: var(--social-color);

            box-shadow:
                0 0 12px var(--social-color),
                0 0 22px var(--social-glow);

            opacity: 0.8;

            transition:
                opacity 0.2s ease,
                width 0.2s ease;
        }


        /* =========================
           HOVER SHINE
        ========================= */

        .social-button::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--social-glow),
                    transparent
                );

            opacity: 0.35;

            transition: left 0.5s ease;

            pointer-events: none;
        }


        /* =========================
           HOVER
        ========================= */

        .social-button:hover {
            transform: translateY(-3px);

            border-color: var(--social-color);

            background:
                linear-gradient(
                    145deg,
                    rgba(30, 17, 12, 0.98),
                    rgba(13, 9, 7, 0.99)
                );

            box-shadow:
                0 0 12px var(--social-glow),
                0 0 30px var(--social-glow),
                inset 0 0 20px var(--social-color-soft);
        }

        .social-button:hover::before {
            opacity: 1;
            width: 4px;
        }

        .social-button:hover::after {
            left: 130%;
        }


        /* =========================
           ICON
        ========================= */

        .icon {
            width: 38px;
            height: 38px;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--social-color-soft);

            border: 1px solid var(--social-border);

            margin-right: 15px;

            flex-shrink: 0;

            overflow: hidden;

            transition:
                background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .icon img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 7px;

            display: block;
        }

        .social-button:hover .icon {
            background: var(--social-color-soft);

            box-shadow:
                0 0 12px var(--social-glow);

            transform: scale(1.04);
        }


        /* =========================
           SOCIAL TEXT
        ========================= */

        .social-info {
            text-align: left;

            flex: 1;
        }

        .social-name {
            font-size: 15px;

            font-weight: 700;

            margin-bottom: 3px;
        }

        .social-handle {
            color: #756b66;

            font-size: 12px;

            transition:
                color 0.2s ease;
        }

        .social-button:hover .social-handle {
            color: #a89b94;
        }


        /* =========================
           ARROW
        ========================= */

        .arrow {
            color: #514943;

            font-size: 20px;

            transition:
                color 0.2s ease,
                transform 0.2s ease,
                text-shadow 0.2s ease;
        }

        .social-button:hover .arrow {
            color: var(--social-color);

            transform: translateX(3px);

            text-shadow:
                0 0 8px var(--social-color);
        }


        /* =========================
           TIKTOK SPECIAL COLOR
        ========================= */

        .tiktok::before {
            background: linear-gradient(
                to bottom,
                #00f2ea,
                #ff0050
            );

            box-shadow:
                0 0 10px #00f2ea,
                0 0 18px #ff0050;
        }

        .tiktok:hover {
            border-color: #00f2ea;

            box-shadow:
                0 0 12px rgba(0, 242, 234, 0.15),
                0 0 28px rgba(255, 0, 80, 0.12),
                inset 0 0 20px rgba(0, 242, 234, 0.025);
        }

        .tiktok:hover .arrow {
            color: #00f2ea;

            text-shadow:
                0 0 8px #00f2ea;
        }


        /* =========================
           INSTAGRAM SPECIAL GRADIENT
        ========================= */

        .instagram::before {
            background:
                linear-gradient(
                    to bottom,
                    #833ab4,
                    #fd1d1d,
                    #fcb045
                );

            box-shadow:
                0 0 10px #fd1d1d,
                0 0 18px rgba(225, 48, 108, 0.5);
        }

        .instagram:hover {
            border-color: #f13f79;

            box-shadow:
                0 0 12px rgba(225, 48, 108, 0.16),
                0 0 28px rgba(131, 58, 180, 0.10),
                inset 0 0 20px rgba(225, 48, 108, 0.025);
        }

        .instagram:hover .arrow {
            color: #f13f79;

            text-shadow:
                0 0 8px #f13f79;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding: 25px 15px;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }

            .username {
                font-size: 26px;
            }

            .social-button {
                min-height: 58px;
            }
        }

    </style>
</head>


<body>
