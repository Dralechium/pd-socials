<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socials</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           PAGE
        ========================= */

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(255, 90, 25, 0.13),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(180, 45, 10, 0.08),
                    transparent 30%
                ),
                #070504;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;

            position: relative;
        }


        /* =========================
           AMBIENT BACKGROUND GLOW
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 650px;
            height: 650px;

            background: #ff4d18;

            opacity: 0.035;

            filter: blur(150px);

            border-radius: 50%;

            top: -300px;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            background: #ff6a21;

            opacity: 0.018;

            filter: blur(130px);

            border-radius: 50%;

            bottom: -200px;
            right: -100px;

            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;

            padding: 30px 20px;

            text-align: center;

            position: relative;

            z-index: 1;
        }


        /* =========================
           PROFILE PICTURE
        ========================= */

        .profile-picture {
            width: 115px;
            height: 115px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #1b100c,
                    #080605
                );

            border: 2px solid rgba(255, 91, 35, 0.8);

            box-shadow:
                0 0 15px rgba(255, 75, 20, 0.45),
                0 0 35px rgba(255, 75, 20, 0.20),
                0 0 70px rgba(255, 60, 15, 0.08);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            position: relative;
        }


        .profile-picture::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.45);

            pointer-events: none;
        }


        .profile-picture img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           USERNAME
        ========================= */

        .username {
            font-size: 30px;

            font-weight: 800;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 80, 25, 0.25),
                0 0 25px rgba(255, 60, 15, 0.08);

            margin-bottom: 7px;
        }


        /* =========================
           HANDLE
        ========================= */

        .handle {
            color: #ff6127;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 14px;

            text-shadow:
                0 0 10px rgba(255, 75, 20, 0.25);
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            color: #a59a95;

            font-size: 14px;

            line-height: 1.6;

            max-width: 400px;

            margin: 0 auto 28px;
        }


        /* =========================
           SOCIAL BUTTON CONTAINER
        ========================= */

        .socials {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        /* =========================
           SOCIAL BUTTON
        ========================= */

        .social-button {
            position: relative;

            width: 100%;

            min-height: 62px;

            display: flex;

            align-items: center;

            padding: 0 22px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 13, 10, 0.97),
                    rgba(10, 8, 7, 0.98)
                );

            border: 1px solid rgba(255, 83, 28, 0.18);

            color: white;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            overflow: hidden;
        }


        /* Orange vertical accent */

        .social-button::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background: #ff5722;

            box-shadow:
                0 0 10px #ff5722,
                0 0 20px rgba(255, 75, 20, 0.45);

            opacity: 0.75;

            transition:
                opacity 0.2s ease,
                width 0.2s ease;
        }


        /* Subtle orange shine */

        .social-button::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 100, 40, 0.035),
                    transparent
                );

            transition: left 0.5s ease;

            pointer-events: none;
        }


        /* =========================
           HOVER
        ========================= */

        .social-button:hover {
            transform: translateY(-3px);

            border-color:
                rgba(255, 91, 35, 0.55);

            background:
                linear-gradient(
                    145deg,
                    rgba(29, 17, 12, 0.98),
                    rgba(13, 9, 7, 0.99)
                );

            box-shadow:
                0 0 12px rgba(255, 75, 20, 0.14),
                0 0 30px rgba(255, 60, 15, 0.06),
                inset 0 0 25px rgba(255, 75, 20, 0.025);
        }


        .social-button:hover::before {
            opacity: 1;

            width: 4px;
        }


        .social-button:hover::after {
            left: 130%;
        }


        /* =========================
           ICON
        ========================= */

        .icon {
            width: 38px;
            height: 38px;

            border-radius: 9px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(255, 78, 25, 0.075);

            border:
                1px solid rgba(255, 85, 30, 0.08);

            color: #ff6127;

            font-size: 13px;

            font-weight: 800;

            margin-right: 15px;

            flex-shrink: 0;

            text-shadow:
                0 0 8px rgba(255, 75, 20, 0.3);

            transition:
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .social-button:hover .icon {
            background:
                rgba(255, 78, 25, 0.12);

            box-shadow:
                0 0 12px rgba(255, 70, 20, 0.08);
        }


        /* =========================
           SOCIAL TEXT
        ========================= */

        .social-info {
            text-align: left;

            flex: 1;
        }


        .social-name {
            font-size: 15px;

            font-weight: 700;

            margin-bottom: 3px;
        }


        .social-handle {
            color: #756b66;

            font-size: 12px;

            transition:
                color 0.2s ease;
        }


        .social-button:hover .social-handle {
            color: #95857d;
        }


        /* =========================
           ARROW
        ========================= */

        .arrow {
            color: #514943;

            font-size: 22px;

            transition:
                color 0.2s ease,
                transform 0.2s ease,
                text-shadow 0.2s ease;
        }


        .social-button:hover .arrow {
            color: #ff6127;

            transform: translateX(4px);

            text-shadow:
                0 0 8px rgba(255, 75, 20, 0.4);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding: 25px 15px;
            }


            .profile-picture {
                width: 100px;
                height: 100px;
            }


            .username {
                font-size: 26px;
            }


            .social-button {
                min-height: 58px;
            }
        }

    </style>
</head>


<body>

    <main class="container">


        <!-- PROFILE PICTURE -->

        <div class="profile-picture">

            <img
                src="https://files.catbox.moe/sw2fmk.png"
                alt="Profile Picture"
            >

        </div>


        <!-- NAME -->

        <h1 class="username">
            Username
        </h1>


        <!-- HANDLE -->

        <div class="handle">
            @username
        </div>


        <!-- DESCRIPTION -->

        <p class="description">
            Content creator, gamer, and professional internet enjoyer.
            Check out my socials below!
        </p>


        <!-- SOCIAL LINKS -->

        <div class="socials">


            <!-- YOUTUBE -->

            <a
                class="social-button"
                href="#"
                target="_blank"
            >

                <div class="icon">
                    YT
                </div>

                <div class="social-info">

                    <div class="social-name">
                        YouTube
                    </div>

                    <div class="social-handle">
                        @username
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- TWITCH -->

            <a
                class="social-button"
                href="#"
                target="_blank"
            >

                <div class="icon">
                    TW
                </div>

                <div class="social-info">

                    <div class="social-name">
                        Twitch
                    </div>

                    <div class="social-handle">
                        twitch.tv/username
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- X / TWITTER -->

            <a
                class="social-button"
                href="#"
                target="_blank"
            >

                <div class="icon">
                    X
                </div>

                <div class="social-info">

                    <div class="social-name">
                        X / Twitter
                    </div>

                    <div class="social-handle">
                        @username
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- DISCORD -->

            <a
                class="social-button"
                href="#"
                target="_blank"
            >

                <div class="icon">
                    DC
                </div>

                <div class="social-info">

                    <div class="social-name">
                        Discord
                    </div>

                    <div class="social-handle">
                        Join my server
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- INSTAGRAM -->

            <a
                class="social-button"
                href="#"
                target="_blank"
            >

                <div class="icon">
                    IG
                </div>

                <div class="social-info">

                    <div class="social-name">
                        Instagram
                    </div>

                    <div class="social-handle">
                        @username
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


        </div>


    </main>

</body>

</html>
